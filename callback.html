<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>StitchKit sign-in</title>
<style>
  :root { --bg: #faf7f2; --ink: #2a2522; --muted: #6b625b; --line: #e4ddd3; --accent: #b4553f; --card: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1d1a18; --ink: #ece6df; --muted: #a89f97; --line: #3a3430; --accent: #e08a72; --card: #262220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: var(--muted); }
  .code { display: flex; gap: 8px; margin-top: 16px; }
  .code input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: 14px ui-monospace, Consolas, monospace; }
  .code button { padding: 8px 14px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Finishing sign-in…</h1>
  <p id="message">Handing you back to StitchKit.</p>
  <div class="code" id="manual" hidden>
    <input id="code" readonly aria-label="Sign-in code">
    <button type="button" id="copy">Copy</button>
  </div>
</main>
<script>
  // Etsy sends the seller here after they approve StitchKit (OAuth 2.0 with PKCE). This page only passes the
  // one-time code back to the StitchKit app on this same computer (127.0.0.1); it keeps nothing and sends it
  // nowhere else. The code is useless without the secret verifier that only the app holds.
  // StitchKit's `state` is "<random>.<port>": the port of the app's short-lived local sign-in listener.
  (function () {
    var params = new URLSearchParams(location.search);
    var title = document.getElementById('title');
    var message = document.getElementById('message');
    var error = params.get('error');
    var code = params.get('code');
    var state = params.get('state') || '';
    if (error) {
      title.textContent = 'Sign-in was not completed';
      message.textContent = (params.get('error_description') || error) + '. You can close this tab and try again from StitchKit.';
      return;
    }
    if (!code) {
      title.textContent = 'Nothing to do here';
      message.textContent = 'This page finishes signing in from the StitchKit app. You can close it.';
      return;
    }
    var showCode = function () {
      title.textContent = 'Paste this code into StitchKit';
      message.textContent = 'If StitchKit did not pick up the sign-in by itself, copy this code into its "Connect" window.';
      document.getElementById('code').value = code + ' ' + state;
      document.getElementById('manual').hidden = false;
    };
    document.getElementById('copy').addEventListener('click', function () {
      var input = document.getElementById('code');
      input.select();
      if (navigator.clipboard) navigator.clipboard.writeText(input.value);
      else document.execCommand('copy');
      this.textContent = 'Copied';
    });
    var port = Number(state.split('.').pop());
    if (Number.isInteger(port) && port >= 1024 && port <= 65535) {
      var back = 'http://127.0.0.1:' + port + '/etsy-callback?' + new URLSearchParams({ code: code, state: state }).toString();
      // Clear the code from the address bar and history before leaving.
      history.replaceState(null, '', location.pathname);
      setTimeout(showCode, 4000);
      location.replace(back);
    } else {
      showCode();
    }
  })();
</script>
</body>
</html>
